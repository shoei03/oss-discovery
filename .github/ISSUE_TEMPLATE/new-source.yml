name: Propose a registry or data source
description: Suggest a registry, API or dataset worth documenting
title: "[source] "
labels: ["new-source"]
body:
  - type: markdown
    attributes:
      value: |
        This project documents how to decide, not everything that exists. A proposal needs to show what it
        does better than what is already documented, with a command anyone can run.
  - type: input
    id: name
    attributes:
      label: Name and URL
    validations:
      required: true
  - type: textarea
    id: covers
    attributes:
      label: What it covers
      description: Which ecosystem, domain or question does it answer
    validations:
      required: true
  - type: textarea
    id: better
    attributes:
      label: Why it beats what is already documented
      description: Which stage of the workflow it fits, and what it does that the current tools cannot
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: A command that demonstrates it
      description: Something a reader can paste and run
      render: shell
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: What that command returns
      render: text
    validations:
      required: true
  - type: dropdown
    id: auth
    attributes:
      label: Authentication
      options:
        - None
        - Free API key
        - Paid
    validations:
      required: true
  - type: input
    id: measured
    attributes:
      label: Date you measured
      placeholder: "2026-09-19"
    validations:
      required: true
